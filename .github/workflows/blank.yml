name: Daily DevOps Job Fetch

on:
  schedule:
    - cron: "30 3 * * *"   # 9:00 AM IST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python fetch_jobs.py
      - name: Commit jobs.csv
        run: |
          if [ -f jobs.csv ]; then
            git config user.name "job-bot"
            git config user.email "job-bot@users.noreply.github.com"
            git add jobs.csv
            git diff --cached --quiet || (git commit -m "Update jobs $(date -u +%F)" && git push)
          fi
