name: Daily DevOps Job Fetch

on:
  schedule:
    - cron: "30 3 * * *"   # 03:30 UTC = 9:00 AM IST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch, score, log
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_CREDS_JSON: ${{ secrets.GOOGLE_CREDS_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
        run: python fetch_jobs.py

      - name: Commit jobs.csv
        run: |
          if [ -f jobs.csv ]; then
            git config user.name "job-bot"
            git config user.email "job-bot@users.noreply.github.com"
            git add jobs.csv
            git diff --cached --quiet || (git commit -m "Update jobs $(date -u +%F)" && git push)
          fi
